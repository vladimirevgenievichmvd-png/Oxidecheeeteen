name: Build Android Shared Library

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up NDK
      uses: nstudio/actions-sdkmanager@v1
      with:
        NDK: 25.2.9519653

    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 ..
        make

    - name: Upload compiled .so artifact
      uses: actions/upload-artifact@v3
      with:
        name: libnative-lib.so
        path: build/libnative-lib.so
